version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: balancevault-db
    environment:
      POSTGRES_DB: balancevault
      POSTGRES_USER: bv_user
      POSTGRES_PASSWORD: bv_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bv_user -d balancevault"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis for Distributed Rate Limiting (Bucket4j)
  redis:
    image: redis:7-alpine
    container_name: balancevault-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. BalanceVault Spring Boot Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: balancevault-backend
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/balancevault
      SPRING_DATASOURCE_USERNAME: bv_user
      SPRING_DATASOURCE_PASSWORD: bv_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 8085
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
