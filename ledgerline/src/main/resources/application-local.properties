# ===================================================================
# Local Development Profile: Zero-Setup Fast Embedded In-Memory DB
# Falls back to PostgreSQL if SPRING_DATASOURCE_URL is supplied
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:balancevault;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

management.health.redis.enabled=false
management.health.db.enabled=true
