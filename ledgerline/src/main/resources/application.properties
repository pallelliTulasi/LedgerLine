# ===================================================================
# BalanceVault Application Configuration
# ===================================================================
spring.application.name=balancevault
server.port=${PORT:8085}

# Database Connection (Handled dynamically by DataSourceConfig)
# Supports DATABASE_URL (Render standard) and SPRING_DATASOURCE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ledgerline_db_0tkf_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:P3q3DriP8okgAXOXxBbtzNMLvSiJXDUD}

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Redis Configuration (for Distributed Rate Limiting)
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# Spring Boot Actuator & Health Indicators
# Default Redis health check to false so app stays UP on cloud even without Redis
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.redis.enabled=${MANAGEMENT_HEALTH_REDIS_ENABLED:false}

# JWT Configuration
balancevault.jwt.secret=balancevault_super_secure_jwt_secret_key_2026_hackathon_token_at_least_256_bits
balancevault.jwt.expiration-ms=86400000

# Rate Limiting Configuration
balancevault.ratelimit.capacity=20
balancevault.ratelimit.duration-minutes=1
