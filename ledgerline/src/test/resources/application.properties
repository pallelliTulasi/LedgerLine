spring.application.name=balancevault-test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=60
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
management.health.db.enabled=true

balancevault.jwt.secret=balancevault_super_secure_jwt_secret_key_2026_hackathon_token_at_least_256_bits
balancevault.jwt.expiration-ms=86400000
balancevault.ratelimit.capacity=20
balancevault.ratelimit.duration-minutes=1
