services:
  # Backend Web Service (Spring Boot 3 REST API)
  - type: web
    name: balancevault-backend
    runtime: docker
    dockerfilePath: ./ledgerline/Dockerfile
    dockerContext: ./ledgerline
    healthCheckPath: /health
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8085
      - key: DATABASE_URL
        fromDatabase:
          name: balancevault-db
          property: connectionString
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: balancevault-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: balancevault-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: balancevault-db
          property: password
      - key: MANAGEMENT_HEALTH_REDIS_ENABLED
        value: "false"

  # Frontend Static Site (React + Vite + Tailwind)
  - type: web
    name: balancevault-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: balancevault-backend
          property: host

databases:
  # Managed PostgreSQL Database
  - name: balancevault-db
    plan: free
    region: oregon
